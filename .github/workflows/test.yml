name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests run in the Google Chrome that comes installed on the runner
      # (vitest.config.js asks for channel "chrome"), so nothing to download.
      - run: npm test
